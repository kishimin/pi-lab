name: Update VRT Snapshots

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-snapshots:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    container:
      # Keep Chromium and system fonts identical to the VRT baseline environment.
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --init --ipc=host
    steps:
      - uses: actions/checkout@v4
      - name: Mark repository safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install dependencies
        run: npm ci
      - name: Install Microsoft Edge
        run: npx playwright install msedge
      - name: Update VRT snapshots
        run: npx playwright test e2e/specs/vrt.spec.ts --update-snapshots
      - name: Commit updated snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add e2e/specs/vrt.spec.ts-snapshots
          if git diff --cached --quiet; then
            echo "No snapshot changes to commit."
            exit 0
          fi
          git commit -m "test: update VRT baseline snapshots"
          git push origin HEAD:${{ github.ref_name }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
